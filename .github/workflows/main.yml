name: test-and-deploy.yml
url=https://github.com/andre-sostenes/Automacao-de-Api-GraphQL-e-PactumJS/blob/main/.github/workflows/test-and-deploy.yml
name: Test and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run all tests
        run: npm test
        continue-on-error: true
      
      - name: Generate test report
        run: npm test -- --reporter json > test-results.json || true
        continue-on-error: true
      
      - name: Upload test results as artifact
        uses: actions/upload-artifact@v3
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results.json
          retention-days: 30

  generate-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create reports directory
        run: mkdir -p reports
      
      - name: Run tests with HTML reporter
        run: npx mocha ./test/**/*.test.js --reporter html --reporter-options reportDir=reports,reportFilename=index.html
        continue-on-error: true
      
      - name: Create summary report
        run: |
          cat > reports/summary.html << 'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Relatório de Testes - PactumJS</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container {
                      max-width: 1200px;
                      margin: 0 auto;
                      background: white;
                      border-radius: 10px;
                      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                      overflow: hidden;
                  }
                  .header {
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      padding: 40px 20px;
                      text-align: center;
                  }
                  .header h1 {
                      font-size: 2.5em;
                      margin-bottom: 10px;
                  }
                  .header p {
                      font-size: 1.1em;
                      opacity: 0.9;
                  }
                  .content {
                      padding: 40px;
                  }
                  .report-section {
                      margin-bottom: 30px;
                  }
                  .report-section h2 {
                      color: #333;
                      margin-bottom: 20px;
                      border-bottom: 3px solid #667eea;
                      padding-bottom: 10px;
                  }
                  .test-suite {
                      background: #f8f9fa;
                      border-left: 4px solid #667eea;
                      padding: 15px;
                      margin-bottom: 15px;
                      border-radius: 5px;
                  }
                  .test-suite h3 {
                      color: #667eea;
                      margin-bottom: 10px;
                  }
                  .meta-info {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                      gap: 20px;
                      margin-bottom: 30px;
                  }
                  .meta-card {
                      background: #f8f9fa;
                      padding: 20px;
                      border-radius: 8px;
                      text-align: center;
                  }
                  .meta-card .value {
                      font-size: 2em;
                      font-weight: bold;
                      color: #667eea;
                      margin: 10px 0;
                  }
                  .meta-card .label {
                      color: #666;
                      font-size: 0.9em;
                  }
                  .footer {
                      background: #f8f9fa;
                      padding: 20px;
                      text-align: center;
                      color: #666;
                      border-top: 1px solid #dee2e6;
                  }
                  .link-button {
                      display: inline-block;
                      margin-top: 20px;
                      padding: 12px 30px;
                      background-color: #667eea;
                      color: white;
                      text-decoration: none;
                      border-radius: 5px;
                      transition: background-color 0.3s;
                  }
                  .link-button:hover {
                      background-color: #764ba2;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🧪 Relatório de Testes</h1>
                      <p>PactumJS - Automação de Testes de API GraphQL</p>
                  </div>
                  <div class="content">
                      <div class="report-section">
                          <h2>📊 Informações da Execução</h2>
                          <div class="meta-info">
                              <div class="meta-card">
                                  <div class="label">Data da Execução</div>
                                  <div class="value" id="execution-date">--</div>
                              </div>
                              <div class="meta-card">
                                  <div class="label">Versão do Node</div>
                                  <div class="value" id="node-version">--</div>
                              </div>
                              <div class="meta-card">
                                  <div class="label">Branch</div>
                                  <div class="value" id="branch">--</div>
                              </div>
                          </div>
                      </div>
                      
                      <div class="report-section">
                          <h2>🔗 Relatórios Detalhados</h2>
                          <div class="test-suite">
                              <h3>Relatório Completo do Mocha</h3>
                              <p>Clique abaixo para visualizar o relatório HTML detalhado com todos os testes:</p>
                              <a href="index.html" class="link-button">📄 Ver Relatório Completo</a>
                          </div>
                      </div>

                      <div class="report-section">
                          <h2>ℹ️ Sobre Este Relatório</h2>
                          <p>Este relatório é gerado automaticamente a cada push ou pull request nos branches <strong>main</strong> e <strong>develop</strong>.</p>
                          <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                              Gerado em <span id="generated-time">--</span> | 
                              <a href="https://github.com/andre-sostenes/Automacao-de-Api-GraphQL-e-PactumJS/actions" target="_blank">Ver Workflows</a>
                          </p>
                      </div>
                  </div>
                  <div class="footer">
                      <p>&copy; 2024 PactumJS - Automação de Testes de API GraphQL</p>
                  </div>
              </div>
              
              <script>
                  document.getElementById('execution-date').textContent = new Date().toLocaleDateString('pt-BR');
                  document.getElementById('node-version').textContent = '18.x';
                  document.getElementById('branch').textContent = 'main / develop';
                  document.getElementById('generated-time').textContent = new Date().toLocaleString('pt-BR');
              </script>
          </body>
          </html>
          EOF
      
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          cname: false
